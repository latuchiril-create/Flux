name: Build Flux Client

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Flux Visuals Client
        run: ./gradlew build buildFree --no-daemon

      - name: Prepare Release Jars
        run: |
          mkdir -p release_jars
          cp build/libs/fluxvisuals-licensed-1.0.0.jar release_jars/fluxvisuals-1.0.0.jar
          cp build/libs/fluxvisuals-licensed-1.0.0.jar release_jars/fluxvisuals-licensed-1.0.0.jar
          cp build/libs/fluxvisuals-free-1.0.0.jar release_jars/fluxvisuals-free-1.0.0.jar

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flux-client-jars
          path: release_jars/*.jar

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Flux Client Latest Release"
          body: "Automated cloud build for Flux Client. Generated automatically from commit ${{ github.sha }}."
          files: |
            release_jars/fluxvisuals-1.0.0.jar
            release_jars/fluxvisuals-licensed-1.0.0.jar
            release_jars/fluxvisuals-free-1.0.0.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
