plugins {
    id "fabric-loom" version "${loom_version}"
    id "maven-publish"
}

def isFreeMode = project.hasProperty("freeMode") && project.property("freeMode").toString().equalsIgnoreCase("true")

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-${isFreeMode ? 'free' : 'licensed'}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

sourceSets {
    main {
        java {
            srcDir "by"
        }
    }
}

repositories {
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "io.github.spair:imgui-java-binding:1.86.11"
    implementation "io.github.spair:imgui-java-lwjgl3:1.86.11"
    runtimeOnly "io.github.spair:imgui-java-natives-windows:1.86.11"
    include "io.github.spair:imgui-java-binding:1.86.11"
    include "io.github.spair:imgui-java-lwjgl3:1.86.11"
    include "io.github.spair:imgui-java-natives-windows:1.86.11"

    // Official Baritone implementation for Fabric (MC 1.21.6-1.21.8).
    // The API-only artifact does not register the pathing engine or mixins.
    modImplementation files("libs/baritone-unoptimized-fabric-1.15.0.jar")

    // Optional Discord Rich Presence transport used by the DiscordRPC module.
    implementation files("discord-game-sdk4j-1.0.0.jar")

    // ONNX Runtime for embedded AutoCaptcha neural network solver
    implementation files("libs/onnxruntime-1.18.0.jar")

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
}

def baritoneJar = file("libs/baritone-unoptimized-fabric-1.15.0.jar")
def discordSdkJar = file("discord-game-sdk4j-1.0.0.jar")
def onnxJar = file("libs/onnxruntime-1.18.0.jar")
tasks.named("jar") {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Fabric Loader does not add an arbitrary raw library JAR from
    // META-INF/jars to the mod class loader. DiscordRPC imports the SDK
    // directly, so embed its classes in the main mod namespace instead.
    from(zipTree(discordSdkJar)) {
        exclude "META-INF/MANIFEST.MF"
        exclude "META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA"
    }
    from(zipTree(onnxJar)) {
        exclude "META-INF/MANIFEST.MF"
        exclude "META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA"
        exclude "ai/onnxruntime/native/linux-**"
        exclude "ai/onnxruntime/native/osx-**"
        exclude "**/*.pdb"
        exclude "**/*.dSYM/**"
    }
    into("META-INF/jars") {
        from(baritoneJar)
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "freeMode", isFreeMode

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }

    doLast {
        if (isFreeMode) {
            def flagFile = file("${destinationDir}/assets/fluxvisuals/free_mode.flag")
            flagFile.parentFile.mkdirs()
            flagFile.text = "free_mode=true\n"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

tasks.named("test") {
    useJUnitPlatform()
}

tasks.register("buildFree", GradleBuild) {
    tasks = ["build"]
    startParameter.projectProperties = [freeMode: "true"]
}

tasks.register("buildLicensed", GradleBuild) {
    tasks = ["build"]
    startParameter.projectProperties = [freeMode: "false"]
}

tasks.register("buildAll", Exec) {
    if (System.getProperty("os.name").toLowerCase().contains("windows")) {
        commandLine "cmd", "/c", "gradlew.bat buildLicensed && gradlew.bat buildFree"
    } else {
        commandLine "sh", "-c", "./gradlew buildLicensed && ./gradlew buildFree"
    }
}
